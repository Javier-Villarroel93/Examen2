name: CI/CD + Deploy

on:
  push:
    branches: ["villarroel"]
  workflow_dispatch:

env:
  IMAGE_VERSION: "3.0.0"
  APP_NAME: "villarroel"
  GH_OWNER: ${{ github.repository_owner }}
  DOCKERFILE: villarroel
  STACK_FILE: villarroel.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  build_and_push:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.vars.outputs.image }}
      owner: ${{ steps.vars.outputs.owner }}
    environment: prueba
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image variables
        id: vars
        run: |
          OWNER_LOWER=$(echo "${GH_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LOWER}/${APP_NAME}"
          echo "owner=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Image to push: ${IMAGE}:${IMAGE_VERSION}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.vars.outputs.owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ env.IMAGE_VERSION }}
            ${{ steps.vars.outputs.image }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    environment: prueba
    steps:
      - uses: actions/checkout@v4

      - name: Copy stack.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: ${{ env.STACK_FILE }}
          target: "/home/${{ secrets.VPS_USER }}/deploy/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            OWNER_LOWER=$(echo "${{ needs.build_and_push.outputs.owner }}")
            IMAGE_VERSION=${{ env.IMAGE_VERSION }}

            echo "Logging in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${OWNER_LOWER}" --password-stdin

            IMAGE="${{ needs.build_and_push.outputs.image }}"
            echo "Pulling image ${IMAGE}:${IMAGE_VERSION}"
            docker pull "${IMAGE}:${IMAGE_VERSION}"

            mkdir -p /home/${{ secrets.VPS_USER }}/deploy

            echo "Deploying stack ${{ secrets.STACK_NAME }} with image version ${IMAGE_VERSION}"
            IMAGE_VERSION=${IMAGE_VERSION} GH_OWNER=${OWNER_LOWER} docker stack deploy \
              -c /home/${{ secrets.VPS_USER }}/deploy/${{ env.STACK_FILE }} \
              ${{ secrets.STACK_NAME }}

            docker stack services ${{ secrets.STACK_NAME }}
